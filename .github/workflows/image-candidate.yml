name: Build release candidate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: release-candidate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: n30nex/mc-cartolive

jobs:
  authorize:
    name: Authorize trusted main CI source
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      authorized: ${{ steps.trust.outputs.authorized }}
      source_sha: ${{ steps.trust.outputs.source_sha }}
      source_tag: ${{ steps.trust.outputs.source_tag }}
      source_ci_run_id: ${{ steps.trust.outputs.source_ci_run_id }}
      source_ci_event: ${{ steps.trust.outputs.source_ci_event }}
      source_ci_head_branch: ${{ steps.trust.outputs.source_ci_head_branch }}
      source_ci_head_repository: ${{ steps.trust.outputs.source_ci_head_repository }}
      verified_main_sha: ${{ steps.trust.outputs.verified_main_sha }}
    steps:
      - name: Verify successful push CI is current repository main
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_CI_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_CI_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_CI_RUN_ID" =~ ^[0-9]+$ ]]
          test "$SOURCE_CI_CONCLUSION" = "success"
          test "$SOURCE_CI_EVENT" = "push"
          test "$SOURCE_CI_HEAD_BRANCH" = "main"
          test "$SOURCE_CI_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID")"
          printf '%s' "$source_run" | jq -e \
            --arg sha "$SOURCE_SHA" --arg repository "$GITHUB_REPOSITORY" \
            '.name == "CI" and .path == ".github/workflows/ci.yml" and .conclusion == "success" and .event == "push" and .head_branch == "main" and .head_sha == $sha and .head_repository.full_name == $repository' >/dev/null
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$current_main_sha"
          echo "authorized=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_tag=sha-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_id=$SOURCE_CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_ci_event=$SOURCE_CI_EVENT" >> "$GITHUB_OUTPUT"
          echo "source_ci_head_branch=$SOURCE_CI_HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_ci_head_repository=$SOURCE_CI_HEAD_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "verified_main_sha=$current_main_sha" >> "$GITHUB_OUTPUT"

  candidate:
    name: Multi-platform candidate
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    steps:
      - name: Reverify current main before source checkout
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          VERIFIED_MAIN_SHA: ${{ needs.authorize.outputs.verified_main_sha }}
        run: |
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$VERIFIED_MAIN_SHA"
          test "$SOURCE_SHA" = "$current_main_sha"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "current_main_sha=$current_main_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout successful source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify version and build metadata
        id: meta
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node scripts/check-version-sync.mjs
          version="$(tr -d '\r\n' < VERSION)"
          build_time="$(git show -s --format=%cI HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
          echo "build_number=${SOURCE_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push candidate once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.source.outputs.tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=MC-CartoLive
            org.opencontainers.image.description=Public-safe MeshCore MQTT live map with RF Replay Studio
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.source.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            VITE_BUILD_NUMBER=${{ steps.meta.outputs.build_number }}
            VITE_APP_ASSET_PACK=canada
            VITE_ENABLE_SERVICE_WORKER=true
      - name: Smoke exact candidate digest
        run: |
          node scripts/package-smoke.mjs \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" \
            --version "${{ steps.meta.outputs.version }}" --pull
      - name: Scan exact candidate digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-candidate.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload scan results
        if: always() && hashFiles('trivy-candidate.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-candidate.sarif
      - name: Attest candidate digest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record candidate manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
          SOURCE_CI_RUN_ID: ${{ needs.authorize.outputs.source_ci_run_id }}
          SOURCE_CI_HEAD_SHA: ${{ needs.authorize.outputs.source_sha }}
          SOURCE_CI_CONCLUSION: success
          SOURCE_CI_WORKFLOW: CI
          SOURCE_CI_EVENT: ${{ needs.authorize.outputs.source_ci_event }}
          SOURCE_CI_HEAD_BRANCH: ${{ needs.authorize.outputs.source_ci_head_branch }}
          SOURCE_CI_HEAD_REPOSITORY: ${{ needs.authorize.outputs.source_ci_head_repository }}
          VERIFIED_MAIN_SHA: ${{ steps.source.outputs.current_main_sha }}
          CANDIDATE_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          jq -n \
            --arg repository "${REGISTRY}/${IMAGE_NAME}" \
            --arg image "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            --arg digest "$DIGEST" --arg gitSha "$SOURCE_SHA" \
            --arg version "$VERSION" --arg buildTime "$BUILD_TIME" \
            --arg sourceCiRunId "$SOURCE_CI_RUN_ID" --arg sourceCiHeadSha "$SOURCE_CI_HEAD_SHA" \
            --arg sourceCiConclusion "$SOURCE_CI_CONCLUSION" --arg sourceCiWorkflow "$SOURCE_CI_WORKFLOW" \
            --arg sourceCiEvent "$SOURCE_CI_EVENT" --arg sourceCiHeadBranch "$SOURCE_CI_HEAD_BRANCH" \
            --arg sourceCiHeadRepository "$SOURCE_CI_HEAD_REPOSITORY" --arg verifiedMainSha "$VERIFIED_MAIN_SHA" \
            --arg candidateWorkflowRunId "$CANDIDATE_WORKFLOW_RUN_ID" \
            '{repository:$repository,image:$image,digest:$digest,gitSha:$gitSha,version:$version,buildTime:$buildTime,platforms:["linux/amd64","linux/arm64"],sourceCiRunId:$sourceCiRunId,sourceCiHeadSha:$sourceCiHeadSha,sourceCiConclusion:$sourceCiConclusion,sourceCiWorkflow:$sourceCiWorkflow,sourceCiEvent:$sourceCiEvent,sourceCiHeadBranch:$sourceCiHeadBranch,sourceCiHeadRepository:$sourceCiHeadRepository,verifiedMainRef:"refs/heads/main",verifiedMainSha:$verifiedMainSha,candidateWorkflowRunId:$candidateWorkflowRunId}' \
            > candidate-manifest.json
      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ steps.source.outputs.sha }}
          path: |
            candidate-manifest.json
            trivy-candidate.sarif
          if-no-files-found: error
          retention-days: 30
