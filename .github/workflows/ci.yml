name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser_smoke:
        description: Run the Docker browser smoke suite
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test, vet, race, vulnerability
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify modules
        working-directory: backend
        run: go mod verify
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Race detector
        working-directory: backend
        run: go test -race ./...
      - name: Reachable vulnerability scan
        working-directory: backend
        run: go tool govulncheck ./...

  frontend:
    name: Frontend test, audit, build, budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Audit
        working-directory: web
        run: npm audit --audit-level=high
      - name: Version, schema, and asset contracts
        run: |
          node scripts/check-version-sync.mjs
          node scripts/public-schema-check.mjs
          node scripts/check-asset-pack.mjs
      - name: Bounded-thread test suite
        working-directory: web
        run: npm test -- --run --pool=threads --maxWorkers=2
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Frontend budgets
        run: node scripts/check-frontend-budget.mjs

  release-ops:
    name: Release and deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Script contract tests
        run: |
          bash scripts/test-release-ops.sh
          bash scripts/test-post-release-audit.sh
          node scripts/test-websocket-flow-probe.mjs
          node scripts/test-public-privacy-retry.mjs
          node scripts/test-public-privacy-websocket.mjs
          node scripts/test-release-verification.mjs
          node scripts/check-cloudflare-cidrs.mjs --online
      - name: Compose contracts
        run: |
          cp .env.example .env
          docker compose config --quiet
          MC_CARTOLIVE_IMAGE=ghcr.io/n30nex/mc-cartolive@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            docker compose -f docker-compose.production.yml config --format json > /tmp/production-compose.json
          jq -e '.services["meshcore-live-map"] | has("build") | not' /tmp/production-compose.json
          jq -e '.services["meshcore-live-map"].environment.SQLITE_BUSY_TIMEOUT_MS == "750"' /tmp/production-compose.json
          jq -e '
            .services["meshcore-live-map"].ports
            | any(
                .host_ip == "127.0.0.1"
                and (.published | tostring) == "39476"
                and (.target | tonumber) == 8080
              )
          ' /tmp/production-compose.json
      - name: Package manifest dry run
        env:
          RELEASE_WORLD_IMAGE: ghcr.io/n30nex/mc-cartolive@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RELEASE_CANADA_IMAGE: ghcr.io/n30nex/mc-cartolive@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          RELEASE_GIT_SHA: ${{ github.sha }}
          RELEASE_BUILD_TIME: "2026-07-10T00:00:00Z"
        run: |
          node scripts/build-release-bundle.mjs
          test -f artifacts/release/release-manifest.json
          jq -e '.manifestVersion == 2 and .images.world.assetPack == "world" and .images.canada.assetPack == "canada" and .images.world.digest != .images.canada.digest and .hostPrerequisites.destructiveFreshDatabase.nodeMinMajor == 18' artifacts/release/release-manifest.json
          version="$(tr -d '\r\n' < VERSION)"
          minor="${version%.*}"
          jq -e --arg version "$version" --arg minor "$minor" --arg sha "$GITHUB_SHA" \
            '.images.world.tags == [$version,$minor,("sha-" + $sha),"latest"] and
             .images.canada.tags == [($version + "-canada"),($minor + "-canada"),("sha-" + $sha + "-canada"),"latest-canada"]' \
            artifacts/release/release-manifest.json
          test -f artifacts/release/stage/mc-cartolive-$(tr -d '\r\n' < VERSION)/docker-compose.production.yml
          test -f artifacts/release/stage/mc-cartolive-$(tr -d '\r\n' < VERSION)/scripts/check-public-privacy.mjs
          test -f artifacts/release/stage/mc-cartolive-$(tr -d '\r\n' < VERSION)/scripts/public-privacy-retry.mjs
          test -f artifacts/release/stage/mc-cartolive-$(tr -d '\r\n' < VERSION)/scripts/public-privacy-websocket.mjs

  docker:
    name: Container build, smoke, scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Read release metadata
        id: release
        shell: bash
        run: |
          echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: meshcore-canada-live-map:ci
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.release.outputs.build_time }}
            VITE_BUILD_NUMBER=${{ github.run_number }}
            VITE_APP_ASSET_PACK=canada
            VITE_ENABLE_SERVICE_WORKER=true
      - name: Smoke image
        run: node scripts/package-smoke.mjs --image meshcore-canada-live-map:ci --version "${{ steps.release.outputs.version }}" --asset-pack canada
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: meshcore-canada-live-map:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-image.sarif

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  browser-smoke:
    name: Desktop and mobile browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.browser_smoke)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser dependencies
        working-directory: web
        run: |
          npm ci
          npm exec playwright install --with-deps chromium
      - name: Start fixture app
        run: |
          cp .env.example .env
          docker compose build
          app_uid="$(docker run --rm --entrypoint id mc-cartolive:dev -u)"
          app_gid="$(docker run --rm --entrypoint id mc-cartolive:dev -g)"
          [[ "$app_uid" =~ ^[0-9]+$ && "$app_gid" =~ ^[0-9]+$ ]]
          sudo install -d -m 0750 -o "$app_uid" -g "$app_gid" data
          docker compose up --no-build -d --remove-orphans
      - name: Wait for readiness
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:39476/readyz | grep -q '"ready":true' && exit 0
            sleep 2
          done
          docker compose logs --tail=180
          exit 1
      - name: Run browser and privacy smoke
        run: |
          node scripts/browser-smoke.mjs --base-url http://127.0.0.1:39476
          node scripts/check-public-privacy.mjs http://127.0.0.1:39476
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-artifacts
          path: artifacts/browser-smoke/
          if-no-files-found: ignore
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=240
