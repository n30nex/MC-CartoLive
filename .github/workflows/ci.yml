name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev/deepseek-v4
  workflow_dispatch:
    inputs:
      browser_smoke:
        description: Run local Docker browser smoke with Playwright
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Govulncheck
        working-directory: backend
        run: go tool govulncheck ./...

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Audit
        working-directory: web
        run: npm audit --audit-level=high

      - name: Version sync
        run: node scripts/check-version-sync.mjs

      - name: Test
        working-directory: web
        run: npm test -- --run

      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read release version
        run: echo "APP_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: meshcore-canada-live-map:ci
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}

      - name: Smoke built image
        run: |
          node scripts/package-smoke.mjs --image meshcore-canada-live-map:ci --version "$APP_VERSION"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npm exec playwright install --with-deps chromium

      - name: Prepare fixture environment
        run: cp .env.example .env

      - name: Start local app
        run: docker compose up --build -d --remove-orphans

      - name: Wait for readiness
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:39476/readyz | grep -q '"ready":true'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=180
          curl -fsS http://127.0.0.1:39476/readyz || true
          exit 1

      - name: Run browser smoke
        run: node scripts/browser-smoke.mjs --base-url http://127.0.0.1:39476

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: artifacts/browser-smoke/
