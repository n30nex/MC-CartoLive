name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test -- --run

      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read release version
        run: echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: meshcore-canada-live-map:ci
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}

      - name: Smoke built image
        run: |
          trap 'docker logs mc-cartolive-ci --tail 160 || true; cat /tmp/mc-health.json /tmp/mc-ready.json /tmp/mc-packets.json 2>/dev/null || true' ERR
          docker run -d --name mc-cartolive-ci -p 18080:8080 \
            -e MQTT_ENABLED=false \
            -e PUBLIC_MODE=true \
            -e PUBLIC_BASE_URL=http://127.0.0.1:18080 \
            -e FIXTURE_REPLAY_PATH=/app/examples/fixtures/synthetic-live.ndjson \
            meshcore-canada-live-map:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz >/tmp/mc-health.json; then
              break
            fi
            sleep 1
          done
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/readyz >/tmp/mc-ready.json; then
              break
            fi
            sleep 1
          done
          python3 -c 'import json,os; data=json.load(open("/tmp/mc-health.json")); assert data.get("version") == os.environ["APP_VERSION"], data'
          docker exec mc-cartolive-ci test -s /app/examples/fixtures/synthetic-live.ndjson
          for i in $(seq 1 90); do
            curl -fsS 'http://127.0.0.1:18080/api/v1/public/packets?limit=25' >/tmp/mc-packets.json
            if python3 -c 'import json,sys; sys.exit(0 if len(json.load(open("/tmp/mc-packets.json")).get("packets", [])) > 0 else 1)'; then
              break
            fi
            sleep 1
          done
          python3 -c 'import json,sys; data=json.load(open("/tmp/mc-packets.json")); assert len(data.get("packets", [])) > 0, data'

      - name: Smoke world fixture
        run: |
          trap 'docker logs mc-cartolive-world-ci --tail 160 || true; cat /tmp/mc-world-ready.json /tmp/mc-world-state.json /tmp/mc-world-packets.json 2>/dev/null || true' ERR
          docker run -d --name mc-cartolive-world-ci -p 18081:8080 \
            -e MQTT_ENABLED=false \
            -e PUBLIC_MODE=true \
            -e PUBLIC_BASE_URL=http://127.0.0.1:18081 \
            -e MAP_REGION_PRESET=world \
            -e DEFAULT_REGION=r1 \
            -e FIXTURE_REPLAY_PATH=/app/examples/fixtures/worldwide-r1.ndjson \
            meshcore-canada-live-map:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/readyz >/tmp/mc-world-ready.json; then
              break
            fi
            sleep 1
          done
          python3 -c 'import json,os; data=json.load(open("/tmp/mc-world-ready.json")); assert data.get("version") == os.environ["APP_VERSION"], data'
          for i in $(seq 1 90); do
            curl -fsS 'http://127.0.0.1:18081/api/v1/public/state' >/tmp/mc-world-state.json
            if python3 -c 'import json,sys; data=json.load(open("/tmp/mc-world-state.json")); sys.exit(0 if data.get("map", {}).get("regionPreset") == "world" and len(data.get("nodes", [])) > 0 and len(data.get("routes", [])) > 0 else 1)'; then
              break
            fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:18081/api/v1/public/packets?limit=25' >/tmp/mc-world-packets.json
          python3 -c 'import json,sys; data=json.load(open("/tmp/mc-world-packets.json")); assert len(data.get("packets", [])) > 0, data; assert data["packets"][0].get("region"), data'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
