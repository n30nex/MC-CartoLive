name: Promote and publish release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  actions: read
  contents: write
  packages: write
  attestations: write
  id-token: write
  security-events: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: n30nex/mc-cartolive

jobs:
  promote:
    name: Promote tested digest and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, VERSION, and ancestry
        id: release
        run: |
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          merge_sha="$(git rev-parse "$tag_ref^{}")"
          test "$merge_sha" = "$(git rev-parse HEAD)"
          version="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch origin main --depth=1
          test "$merge_sha" = "$(git rev-parse origin/main)"

          tag_message="$(git for-each-ref --format='%(contents)' "$tag_ref")"
          trailers="$(printf '%s\n' "$tag_message" | git interpret-trailers --parse)"
          mapfile -t candidate_run_ids < <(printf '%s\n' "$trailers" | sed -n 's/^Candidate-Run-Id:[[:space:]]*//p')
          mapfile -t candidate_run_attempts < <(printf '%s\n' "$trailers" | sed -n 's/^Candidate-Run-Attempt:[[:space:]]*//p')
          mapfile -t candidate_world_digests < <(printf '%s\n' "$trailers" | sed -n 's/^Candidate-World-Digest:[[:space:]]*//p')
          mapfile -t candidate_canada_digests < <(printf '%s\n' "$trailers" | sed -n 's/^Candidate-Canada-Digest:[[:space:]]*//p')
          mapfile -t candidate_deployed_times < <(printf '%s\n' "$trailers" | sed -n 's/^Candidate-Deployed-At:[[:space:]]*//p')
          mapfile -t release_verification_base64 < <(printf '%s\n' "$trailers" | sed -n 's/^Release-Verification-Base64:[[:space:]]*//p')
          test "${#candidate_run_ids[@]}" -eq 1
          test "${#candidate_run_attempts[@]}" -eq 1
          test "${#candidate_world_digests[@]}" -eq 1
          test "${#candidate_canada_digests[@]}" -eq 1
          test "${#candidate_deployed_times[@]}" -eq 1
          test "${#release_verification_base64[@]}" -eq 1
          candidate_run_id="${candidate_run_ids[0]}"
          candidate_run_attempt="${candidate_run_attempts[0]}"
          candidate_world_digest="${candidate_world_digests[0]}"
          candidate_canada_digest="${candidate_canada_digests[0]}"
          candidate_deployed_at="${candidate_deployed_times[0]}"
          verification_base64="${release_verification_base64[0]}"
          [[ "$candidate_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$candidate_run_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$candidate_world_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$candidate_canada_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$candidate_world_digest" != "$candidate_canada_digest"
          deployed_epoch="$(date -u -d "$candidate_deployed_at" +%s)"
          tagger_epoch="$(git for-each-ref --format='%(taggerdate:unix)' "$tag_ref")"
          [[ "$deployed_epoch" =~ ^[0-9]+$ ]]
          [[ "$tagger_epoch" =~ ^[0-9]+$ ]]
          test "$tagger_epoch" -ge $((deployed_epoch + 300))

          printf '%s' "$verification_base64" | base64 --decode > /tmp/release-verification.json
          jq -e 'type == "object" and .formatVersion == 1' /tmp/release-verification.json >/dev/null

          node scripts/check-version-sync.mjs
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$candidate_run_id" >> "$GITHUB_OUTPUT"
          echo "candidate_run_attempt=$candidate_run_attempt" >> "$GITHUB_OUTPUT"
          echo "candidate_world_digest=$candidate_world_digest" >> "$GITHUB_OUTPUT"
          echo "candidate_canada_digest=$candidate_canada_digest" >> "$GITHUB_OUTPUT"
          echo "candidate_deployed_at=$candidate_deployed_at" >> "$GITHUB_OUTPUT"
      - name: Require successful main CI and CodeQL for the tagged SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for workflow in ci.yml codeql.yml; do
            runs_json="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$MERGE_SHA" -f status=completed -f per_page=100)"
            count="$(printf '%s' "$runs_json" | jq --arg repository "$REPOSITORY" \
              '[.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "main" and .head_repository.full_name == $repository)] | length')"
            test "$count" -gt 0
          done
      - name: Load canonical full performance evidence
        id: performance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          artifact_name="release-performance-full-$MERGE_SHA"
          artifact_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$artifact_name" -f per_page=100)"
          artifact_id="$(printf '%s' "$artifact_json" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          run_id="$(printf '%s' "$artifact_json" | jq -r --argjson id "${artifact_id:-0}" '.artifacts[] | select(.id == $id) | .workflow_run.id')"
          test -n "$artifact_id"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          printf '%s' "$run_json" | jq -e \
            --arg sha "$MERGE_SHA" --arg repository "$GITHUB_REPOSITORY" \
            '.name == "Release performance gate" and .path == ".github/workflows/release-performance.yml" and .conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $sha and .head_repository.full_name == $repository' >/dev/null
          rm -rf /tmp/mc-cartolive-performance-evidence
          mkdir -p /tmp/mc-cartolive-performance-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/mc-cartolive-performance.zip
          unzip -q /tmp/mc-cartolive-performance.zip -d /tmp/mc-cartolive-performance-evidence
          report=/tmp/mc-cartolive-performance-evidence/report.json
          test -f "$report"
          workflow_ref="$GITHUB_REPOSITORY/.github/workflows/release-performance.yml@refs/heads/main"
          jq -e \
            --arg sha "$MERGE_SHA" --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$run_id" --arg version "$VERSION" --arg workflowRef "$workflow_ref" \
            '.version == $version and .profile == "full" and .canonicalReleaseProof == true and .passed == true and (.failures | length) == 0 and
             .github.sha == $sha and .github.ref == "refs/heads/main" and .github.repository == $repository and .github.event == "workflow_dispatch" and .github.workflow == "Release performance gate" and .github.workflowRef == $workflowRef and .github.runId == $runId and
             .config == {sustainedRate:20,sustainedSeconds:300,burstRate:100,burstSeconds:60,apiRows:5000000,apiExpiredRows:100000,apiExpiredAgeHours:720,apiPathRows:10000,apiEvents:20000,apiSamples:200,wsClients:250,wsSeconds:300,wsQuietSeconds:70,wsIsolationEvents:1000,wsIsolationRate:100,wsIsolationBytes:4096,mqttQueueCapacity:4096,derivedQueueCapacity:1024,metricSampleMs:250,memoryLimitBytes:629145600} and
             .phases.sustainedIngest.passed == true and .phases.sustainedIngest.reportedPrimaryQueueCapacities == [4096] and .phases.sustainedIngest.reportedDerivedQueueCapacities == [1024] and .phases.sustainedIngest.processRssSource == "linux-proc-status-vmrss" and .phases.sustainedIngest.processRssP95Bytes > 0 and .phases.sustainedIngest.processRssP95Bytes < 629145600 and .phases.sustainedIngest.queueOldestP99Ms < 500 and .phases.sustainedIngest.observationToBroadcastP95Ms < 1000 and .phases.sustainedIngest.observationToBroadcastMaxMs <= 5000 and .phases.sustainedIngest.primaryDeadlineFailures == 0 and .phases.sustainedIngest.derivedProjectionQueueDepth == 0 and .phases.sustainedIngest.derivedProjectionFailures == 0 and
             .phases.burstIngest.passed == true and .phases.burstIngest.reportedPrimaryQueueCapacities == [4096] and .phases.burstIngest.reportedDerivedQueueCapacities == [1024] and .phases.burstIngest.processRssSource == "linux-proc-status-vmrss" and .phases.burstIngest.processRssP95Bytes > 0 and .phases.burstIngest.processRssP95Bytes < 629145600 and .phases.burstIngest.queueOldestP99Ms < 2000 and .phases.burstIngest.observationToBroadcastP95Ms < 2000 and .phases.burstIngest.observationToBroadcastMaxMs <= 5000 and .phases.burstIngest.primaryDeadlineFailures == 0 and .phases.burstIngest.derivedProjectionQueueDepth == 0 and .phases.burstIngest.derivedProjectionFailures == 0 and
             .phases.api.passed == true and .phases.api.seeded.observationRows >= 5000000 and .phases.api.seeded.expiredObservationRows == 100000 and .phases.api.seeded.multiHopEdgeRows > 0 and .phases.api.seeded.observerStatusRows > 0 and .phases.api.postRetention.expiredObservationRows == 0 and .phases.api.browser.passed == true and (.phases.api.browser.releaseGates | length) == 2 and .phases.websocket.passed == true and .phases.websocket.clients == 250' "$report" >/dev/null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Load immutable candidate evidence
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          CANDIDATE_RUN_ID: ${{ steps.release.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.release.outputs.candidate_run_attempt }}
          CANDIDATE_WORLD_DIGEST: ${{ steps.release.outputs.candidate_world_digest }}
          CANDIDATE_CANADA_DIGEST: ${{ steps.release.outputs.candidate_canada_digest }}
          MAIN_PERFORMANCE_RUN_ID: ${{ steps.performance.outputs.run_id }}
        run: |
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main_sha" = "$MERGE_SHA"
          artifact_name="release-candidate-$MERGE_SHA-$CANDIDATE_RUN_ID-$CANDIDATE_RUN_ATTEMPT"
          artifact_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$artifact_name" -f per_page=100)"
          artifact_id="$(printf '%s' "$artifact_json" | jq -r \
            --argjson runId "$CANDIDATE_RUN_ID" --arg artifactName "$artifact_name" \
            '[.artifacts[] | select(.expired == false and .name == $artifactName and .workflow_run.id == $runId)] | if length == 1 then .[0].id else empty end')"
          test -n "$artifact_id"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/attempts/$CANDIDATE_RUN_ATTEMPT")"
          printf '%s' "$run_json" | jq -e \
            --arg sha "$MERGE_SHA" --arg repository "$GITHUB_REPOSITORY" --argjson attempt "$CANDIDATE_RUN_ATTEMPT" \
            '.conclusion == "success" and .run_attempt == $attempt and .path == ".github/workflows/image-candidate.yml" and .event == "workflow_run" and .head_branch == "main" and .head_sha == $sha and .head_repository.full_name == $repository' >/dev/null
          rm -rf /tmp/mc-cartolive-candidate-evidence
          mkdir -p /tmp/mc-cartolive-candidate-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/mc-cartolive-candidate.zip
          unzip -q /tmp/mc-cartolive-candidate.zip -d /tmp/mc-cartolive-candidate-evidence
          manifest=/tmp/mc-cartolive-candidate-evidence/candidate-manifest.json
          test -f "$manifest"
          candidate_tag_base="candidate-$MERGE_SHA-$CANDIDATE_RUN_ID-$CANDIDATE_RUN_ATTEMPT"
          world_candidate_tag="$candidate_tag_base-world"
          canada_candidate_tag="$candidate_tag_base-canada"
          release_ref="refs/heads/codex/release-$VERSION"
          printf '%s' "$(cat "$manifest")" | jq -e \
            --arg sha "$MERGE_SHA" --arg version "$VERSION" --arg repository "${REGISTRY}/${IMAGE_NAME}" \
            --arg sourceRepository "$GITHUB_REPOSITORY" --arg candidateRunId "$CANDIDATE_RUN_ID" \
            --arg candidateRunAttempt "$CANDIDATE_RUN_ATTEMPT" --arg worldCandidateTag "$world_candidate_tag" --arg canadaCandidateTag "$canada_candidate_tag" --arg releaseRef "$release_ref" --arg mainPerformanceRunId "$MAIN_PERFORMANCE_RUN_ID" \
            '.gitSha == $sha and .sourceCiHeadSha == $sha and .sourceCiConclusion == "success" and .sourceCiBrowserSmokeConclusion == "success" and .sourceCiWorkflow == "CI" and .sourceCiEvent == "push" and .sourceCiHeadBranch == "main" and .sourceCiHeadRepository == $sourceRepository and .verifiedMainRef == "refs/heads/main" and .verifiedMainSha == $sha and .candidateWorkflowRunId == $candidateRunId and .candidateWorkflowRunAttempt == $candidateRunAttempt and .images.world.candidateTag == $worldCandidateTag and .images.world.assetPack == "world" and .images.canada.candidateTag == $canadaCandidateTag and .images.canada.assetPack == "canada" and .premergeHeadRef == $releaseRef and (.premergeHeadSha | test("^[0-9a-f]{40}$")) and (.premergeRunId | test("^[1-9][0-9]*$")) and .premergeCanonicalProof == true and .mainPerformanceRunId == $mainPerformanceRunId and .mainPerformanceCanonicalProof == true and .version == $version and .repository == $repository' >/dev/null
          source_ci_run_id="$(jq -r '.sourceCiRunId' "$manifest")"
          [[ "$source_ci_run_id" =~ ^[0-9]+$ ]]
          source_ci_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_ci_run_id")"
          printf '%s' "$source_ci_json" | jq -e --arg sha "$MERGE_SHA" --arg repository "$GITHUB_REPOSITORY" \
            '.name == "CI" and .path == ".github/workflows/ci.yml" and .conclusion == "success" and .event == "push" and .head_branch == "main" and .head_sha == $sha and .head_repository.full_name == $repository' >/dev/null
          source_ci_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_ci_run_id/jobs?filter=latest&per_page=100")"
          test "$(printf '%s' "$source_ci_jobs" | jq '[.jobs[] | select(.name == "Desktop and mobile browser smoke" and .conclusion == "success")] | length')" -eq 1
          world_digest="$(jq -r '.images.world.digest' "$manifest")"
          canada_digest="$(jq -r '.images.canada.digest' "$manifest")"
          [[ "$world_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$canada_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$world_digest" = "$CANDIDATE_WORLD_DIGEST"
          test "$canada_digest" = "$CANDIDATE_CANADA_DIGEST"
          test "$world_digest" != "$canada_digest"
          test "$(jq -r '.images.world.image' "$manifest")" = "${REGISTRY}/${IMAGE_NAME}@$world_digest"
          test "$(jq -r '.images.canada.image' "$manifest")" = "${REGISTRY}/${IMAGE_NAME}@$canada_digest"
          build_time="$(jq -r '.buildTime' "$manifest")"
          test -n "$build_time"
          test "$build_time" != "null"
          date -u -d "$build_time" +%Y-%m-%dT%H:%M:%SZ >/dev/null
          echo "world_digest=$world_digest" >> "$GITHUB_OUTPUT"
          echo "canada_digest=$canada_digest" >> "$GITHUB_OUTPUT"
          echo "run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$CANDIDATE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "world_candidate_tag=$world_candidate_tag" >> "$GITHUB_OUTPUT"
          echo "canada_candidate_tag=$canada_candidate_tag" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
          echo "premerge_run_id=$(jq -r '.premergeRunId' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "premerge_head_sha=$(jq -r '.premergeHeadSha' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_id=$source_ci_run_id" >> "$GITHUB_OUTPUT"
      - name: Load trusted live five-minute audit evidence
        env:
          DEPLOY_SSH_KEY: ${{ secrets.MC_CARTOLIVE_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.MC_CARTOLIVE_DEPLOY_KNOWN_HOSTS }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          CANADA_DIGEST: ${{ steps.evidence.outputs.canada_digest }}
          DEPLOYED_AT: ${{ steps.release.outputs.candidate_deployed_at }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mc-cartolive-release
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/mc-cartolive-release ~/.ssh/known_hosts
          ssh -i ~/.ssh/mc-cartolive-release -o BatchMode=yes -o IdentitiesOnly=yes \
            root@134.122.45.228 bash -s -- "$MERGE_SHA" "$CANADA_DIGEST" "$DEPLOYED_AT" > /tmp/live-5m-audit.json <<'REMOTE'
          set -euo pipefail
          sha="$1"
          digest="$2"
          deployed_at="$3"
          for result in /var/log/mc-cartolive-release-audit/*.5m.json; do
            if jq -e --arg sha "$sha" --arg digest "$digest" --arg deployedAt "$deployed_at" \
              '.phase == "5m" and .passed == true and .release.gitSha == $sha and .release.imageDigest == $digest and .release.deployedAt == $deployedAt' "$result" >/dev/null 2>&1; then
              cat "$result"
              exit 0
            fi
          done
          exit 1
          REMOTE
          jq -e 'type == "object" and .phase == "5m" and .passed == true' /tmp/live-5m-audit.json >/dev/null
      - name: Validate trusted five-minute release evidence
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          CANDIDATE_RUN_ID: ${{ steps.release.outputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.release.outputs.candidate_run_attempt }}
          WORLD_DIGEST: ${{ steps.evidence.outputs.world_digest }}
          CANADA_DIGEST: ${{ steps.evidence.outputs.canada_digest }}
          DEPLOYED_AT: ${{ steps.release.outputs.candidate_deployed_at }}
          PREMERGE_PERFORMANCE_RUN_ID: ${{ steps.evidence.outputs.premerge_run_id }}
          PREMERGE_PERFORMANCE_SHA: ${{ steps.evidence.outputs.premerge_head_sha }}
          MAIN_PERFORMANCE_RUN_ID: ${{ steps.performance.outputs.run_id }}
          BROWSER_RUN_ID: ${{ steps.performance.outputs.run_id }}
        run: |
          performance_report=/tmp/mc-cartolive-performance-evidence/report.json
          jq --argjson workflowRunId "$BROWSER_RUN_ID" '
            [.phases.api.browser.releaseGates[].liveFlow] as $flows |
            {workflowRunId:$workflowRunId,
             receiveToStateP95Ms:([$flows[].metrics.receiveToStateP95Ms] | max),
             receiveToAnimationP95Ms:([$flows[].metrics.receiveToAnimationP95Ms] | max),
             maxVisualAgeMs:([$flows[].metrics.maxVisualAgeMs] | max),
             eligibleAnimations:([$flows[].count] | add),
             animationStarts:([$flows[].metrics.animationStarts] | add),
             animationLoss:(([$flows[].count] | add) - ([$flows[].metrics.animationStarts] | add)),
             emergencyActivations:([$flows[].metrics.emergencyActivations] | add),
             frameP95Ms:([$flows[].metrics.frameP95Ms] | max),
             repeatedLongTasks:([$flows[].metrics.repeatedLongTasks] | add)}' "$performance_report" > /tmp/trusted-browser.json
          audit_sha="$(sha256sum /tmp/live-5m-audit.json | awk '{print $1}')"
          jq --arg resultSha256 "$audit_sha" '
            {phase:.phase,passed:.passed,resultSha256:$resultSha256,
             snapshotIntegrityCheck:.database.integrityCheck,
             snapshotForeignKeyCheck:.database.foreignKeyCheck,
             snapshotSha256:.database.snapshotSha256,
             backupVerificationSha256:.release.backupVerificationSha256,
             schemaVersion:.database.schemaVersion,
             freeGiB:(.filesystem.freeBytes / 1073741824),
             freePercent:.filesystem.freePercent}' /tmp/live-5m-audit.json > /tmp/trusted-audit.json
          jq --slurpfile browser /tmp/trusted-browser.json '
            {"5m":{completedAt:.completedAt,passed:.passed,
             acceptedDelta:.ingest.acceptedSinceDeployment,
             processedDelta:.ingest.processedSinceDeployment,
             publicEventDelta:.ingest.publicEventsSinceDeployment,
             writeFailures:.ingest.writeFailuresTotal,
             deadlineFailures:.ingest.primaryDeadlineFailuresTotal,
             primaryDrops:.ingest.droppedTotal,
             derivedDrops:.ingest.derivedDroppedTotal,
             animationLoss:$browser[0].animationLoss,
             emergencyActivations:$browser[0].emergencyActivations,
             restarts:.process.containerRestartCount,
             oomKills:(if .process.oomKilled == true then 1 else 0 end)}}' /tmp/live-5m-audit.json > /tmp/trusted-canary.json
          jq -e --slurpfile browser /tmp/trusted-browser.json --slurpfile canary /tmp/trusted-canary.json --slurpfile audit /tmp/trusted-audit.json \
            '.browser == $browser[0] and .canary == $canary[0] and .audit == $audit[0]' /tmp/release-verification.json >/dev/null
          node scripts/release-verification.mjs \
            --input /tmp/release-verification.json --output /tmp/release-verification.canonical.json \
            --expect-version "$VERSION" --expect-git-sha "$MERGE_SHA" \
            --expect-candidate-run-id "$CANDIDATE_RUN_ID" --expect-candidate-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --expect-world-digest "$WORLD_DIGEST" --expect-canada-digest "$CANADA_DIGEST" \
            --expect-deployed-at "$DEPLOYED_AT" \
            --expect-premerge-performance-run-id "$PREMERGE_PERFORMANCE_RUN_ID" \
            --expect-premerge-performance-sha "$PREMERGE_PERFORMANCE_SHA" \
            --expect-main-performance-run-id "$MAIN_PERFORMANCE_RUN_ID" \
            --expect-browser-run-id "$BROWSER_RUN_ID"
          mv /tmp/release-verification.canonical.json /tmp/release-verification.json
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve previously built candidate
        id: candidate
        shell: bash
        env:
          WORLD_EVIDENCE_DIGEST: ${{ steps.evidence.outputs.world_digest }}
          CANADA_EVIDENCE_DIGEST: ${{ steps.evidence.outputs.canada_digest }}
          WORLD_CANDIDATE_TAG: ${{ steps.evidence.outputs.world_candidate_tag }}
          CANADA_CANDIDATE_TAG: ${{ steps.evidence.outputs.canada_candidate_tag }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          for pack in world canada; do
            if [ "$pack" = world ]; then tag="$WORLD_CANDIDATE_TAG"; expected="$WORLD_EVIDENCE_DIGEST"; else tag="$CANADA_CANDIDATE_TAG"; expected="$CANADA_EVIDENCE_DIGEST"; fi
            candidate="$image:$tag"
            inspect="$(docker buildx imagetools inspect "$candidate")"
            digest="$(printf '%s\n' "$inspect" | awk '$1 == "Digest:" {print $2; exit}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$digest" = "$expected"
            echo "${pack}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "${pack}_image=$image@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Verify OCI identity on every release platform
        env:
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          WORLD_CANDIDATE_IMAGE: ${{ steps.candidate.outputs.world_image }}
          CANADA_CANDIDATE_IMAGE: ${{ steps.candidate.outputs.canada_image }}
          EXPECTED_BUILD_TIME: ${{ steps.evidence.outputs.build_time }}
          CANDIDATE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.evidence.outputs.run_attempt }}
          WORLD_CANDIDATE_TAG: ${{ steps.evidence.outputs.world_candidate_tag }}
          CANADA_CANDIDATE_TAG: ${{ steps.evidence.outputs.canada_candidate_tag }}
        run: |
          repository="${REGISTRY}/${IMAGE_NAME}"
          for pack in world canada; do
            if [ "$pack" = world ]; then candidate="$WORLD_CANDIDATE_IMAGE"; expected_tag="$WORLD_CANDIDATE_TAG"; else candidate="$CANADA_CANDIDATE_IMAGE"; expected_tag="$CANADA_CANDIDATE_TAG"; fi
            index_json="$(docker buildx imagetools inspect --raw "$candidate")"
            for architecture in amd64 arm64; do
              child_digest="$(printf '%s' "$index_json" | jq -r --arg architecture "$architecture" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)] | if length == 1 then .[0].digest else empty end')"
              [[ "$child_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              image_json="$(docker buildx imagetools inspect "$repository@$child_digest" --format '{{json .Image}}')"
              printf '%s' "$image_json" | jq -e \
                --arg architecture "$architecture" --arg sha "$MERGE_SHA" --arg source "https://github.com/$GITHUB_REPOSITORY" \
                --arg version "$VERSION" --arg created "$EXPECTED_BUILD_TIME" --arg runId "$CANDIDATE_RUN_ID" \
                --arg runAttempt "$CANDIDATE_RUN_ATTEMPT" --arg candidateTag "$expected_tag" --arg pack "$pack" \
                '.architecture == $architecture and .os == "linux" and
                 .config.Labels["org.opencontainers.image.revision"] == $sha and
                 .config.Labels["org.opencontainers.image.source"] == $source and
                 .config.Labels["org.opencontainers.image.version"] == $version and
                 .config.Labels["org.opencontainers.image.created"] == $created and
                 .config.Labels["org.mc-cartolive.candidate.workflow-run-id"] == $runId and
                 .config.Labels["org.mc-cartolive.candidate.workflow-run-attempt"] == $runAttempt and
                 .config.Labels["org.mc-cartolive.candidate.tag"] == $candidateTag and
                 .config.Labels["org.mc-cartolive.asset-pack"] == $pack' >/dev/null
            done
          done
      - name: Verify world candidate provenance belongs to this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify "oci://${{ steps.candidate.outputs.world_image }}" --repo "$GITHUB_REPOSITORY"
      - name: Verify Canada candidate provenance belongs to this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify "oci://${{ steps.candidate.outputs.canada_image }}" --repo "$GITHUB_REPOSITORY"
      - name: Re-smoke exact world candidate and compiled identity
        env:
          EXPECTED_BUILD_TIME: ${{ steps.evidence.outputs.build_time }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
        run: |
          cleanup() { docker rm -f mc-cartolive-package-smoke-synthetic mc-cartolive-package-smoke-world >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          node scripts/package-smoke.mjs \
            --image "${{ steps.candidate.outputs.world_image }}" \
            --version "${{ steps.release.outputs.version }}" --asset-pack world --pull --keep
          for port in 18082 18083; do
            curl -fsS --max-time 10 "http://127.0.0.1:$port/healthz" | jq -e \
              --arg buildTime "$EXPECTED_BUILD_TIME" --arg gitSha "$MERGE_SHA" \
              '.buildTime == $buildTime and .gitSha == $gitSha' >/dev/null
          done
      - name: Re-smoke exact Canada candidate and compiled identity
        env:
          EXPECTED_BUILD_TIME: ${{ steps.evidence.outputs.build_time }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
        run: |
          cleanup() { docker rm -f mc-cartolive-package-smoke-synthetic mc-cartolive-package-smoke-world >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          node scripts/package-smoke.mjs \
            --image "${{ steps.candidate.outputs.canada_image }}" \
            --version "${{ steps.release.outputs.version }}" --asset-pack canada --pull --keep
          for port in 18082 18083; do
            curl -fsS --max-time 10 "http://127.0.0.1:$port/healthz" | jq -e \
              --arg buildTime "$EXPECTED_BUILD_TIME" --arg gitSha "$MERGE_SHA" \
              '.buildTime == $buildTime and .gitSha == $gitSha' >/dev/null
          done
      - name: Re-scan exact world candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.world_image }}
          format: sarif
          output: trivy-release-world.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Re-scan exact Canada candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidate.outputs.canada_image }}
          format: sarif
          output: trivy-release-canada.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload world release scan
        if: always() && hashFiles('trivy-release-world.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-release-world.sarif
          category: trivy-release-world
      - name: Upload Canada release scan
        if: always() && hashFiles('trivy-release-canada.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-release-canada.sarif
          category: trivy-release-canada
      - name: Generate world SPDX SBOM asset
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.candidate.outputs.world_image }}
          format: spdx-json
          output-file: /tmp/mc-cartolive-${{ steps.release.outputs.version }}-world.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate Canada SPDX SBOM asset
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.candidate.outputs.canada_image }}
          format: spdx-json
          output-file: /tmp/mc-cartolive-${{ steps.release.outputs.version }}-canada.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build deployment bundle and release manifest
        env:
          RELEASE_WORLD_IMAGE: ${{ steps.candidate.outputs.world_image }}
          RELEASE_CANADA_IMAGE: ${{ steps.candidate.outputs.canada_image }}
          RELEASE_GIT_SHA: ${{ steps.release.outputs.merge_sha }}
          RELEASE_BUILD_TIME: ${{ steps.evidence.outputs.build_time }}
        run: |
          node scripts/build-release-bundle.mjs
          mkdir -p artifacts/release/assets
          tar -C artifacts/release/stage -czf "artifacts/release/assets/mc-cartolive-${{ steps.release.outputs.version }}-deploy.tar.gz" \
            "mc-cartolive-${{ steps.release.outputs.version }}"
          cp artifacts/release/release-manifest.json artifacts/release/assets/
          cp /tmp/release-verification.json artifacts/release/assets/
          cp docs/public-api.openapi.json artifacts/release/assets/
          cp "docs/${{ steps.release.outputs.version }}/upgrade-and-rollback.md" artifacts/release/assets/ROLLBACK.md
          cp trivy-release-world.sarif trivy-release-canada.sarif artifacts/release/assets/
          cp "/tmp/mc-cartolive-${{ steps.release.outputs.version }}-world.spdx.json" artifacts/release/assets/
          cp "/tmp/mc-cartolive-${{ steps.release.outputs.version }}-canada.spdx.json" artifacts/release/assets/
      - name: Generate checksums
        working-directory: artifacts/release/assets
        run: sha256sum * > SHA256SUMS
      - name: Verify complete release asset set before publication
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MINOR: ${{ steps.release.outputs.minor }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          WORLD_IMAGE: ${{ steps.candidate.outputs.world_image }}
          CANADA_IMAGE: ${{ steps.candidate.outputs.canada_image }}
        run: |
          assets=artifacts/release/assets
          test -s "$assets/mc-cartolive-$VERSION-deploy.tar.gz"
          test -s "$assets/mc-cartolive-$VERSION-world.spdx.json"
          test -s "$assets/mc-cartolive-$VERSION-canada.spdx.json"
          test -s "$assets/trivy-release-world.sarif"
          test -s "$assets/trivy-release-canada.sarif"
          test -s "$assets/release-manifest.json"
          test -s "$assets/release-verification.json"
          test -s "$assets/public-api.openapi.json"
          test -s "$assets/ROLLBACK.md"
          test -s "$assets/SHA256SUMS"
          (cd "$assets" && sha256sum -c SHA256SUMS)
          tar -tzf "$assets/mc-cartolive-$VERSION-deploy.tar.gz" >/dev/null
          jq -e '.spdxVersion | startswith("SPDX-")' "$assets/mc-cartolive-$VERSION-world.spdx.json" >/dev/null
          jq -e '.spdxVersion | startswith("SPDX-")' "$assets/mc-cartolive-$VERSION-canada.spdx.json" >/dev/null
          jq -e '.version == "2.1.0" and (.runs | length) > 0' "$assets/trivy-release-world.sarif" >/dev/null
          jq -e '.version == "2.1.0" and (.runs | length) > 0' "$assets/trivy-release-canada.sarif" >/dev/null
          jq -e --arg version "$VERSION" '.info.version == $version' "$assets/public-api.openapi.json" >/dev/null
          jq -e \
            --arg version "$VERSION" --arg minor "$MINOR" --arg sha "$MERGE_SHA" \
            --arg worldImage "$WORLD_IMAGE" --arg canadaImage "$CANADA_IMAGE" \
            '.version == $version and .gitSha == $sha and
             .images.world.reference == $worldImage and .images.world.assetPack == "world" and
             .images.world.tags == [$version,$minor,("sha-" + $sha),"latest"] and
             .images.canada.reference == $canadaImage and .images.canada.assetPack == "canada" and
             .images.canada.tags == [($version + "-canada"),($minor + "-canada"),("sha-" + $sha + "-canada"),"latest-canada"]' \
            "$assets/release-manifest.json" >/dev/null
      - name: Attest release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/release/assets/*
      - name: Preflight GitHub release creation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -s "docs/$VERSION/release_notes.md"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')" = "tag"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing to mutate public image aliases" >&2
            exit 1
          fi
          # Prove the API/token is healthy so an absent release is not confused
          # with a connectivity or authentication failure from the view above.
          gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name' | grep -Fx "$GITHUB_REPOSITORY"
      - name: Promote exact world and Canada manifest digests
        run: |
          # This is deliberately the final step before creating the GitHub
          # release: every build, smoke, scan, SBOM, bundle, checksum, and
          # attestation prerequisite above must succeed before public aliases
          # can change.
          image="${REGISTRY}/${IMAGE_NAME}"
          world_source="${{ steps.candidate.outputs.world_image }}"
          canada_source="${{ steps.candidate.outputs.canada_image }}"
          docker buildx imagetools create \
            --tag "$image:${{ steps.release.outputs.version }}" \
            --tag "$image:${{ steps.release.outputs.minor }}" \
            --tag "$image:sha-${{ steps.release.outputs.merge_sha }}" \
            --tag "$image:latest" \
            "$world_source"
          docker buildx imagetools create \
            --tag "$image:${{ steps.release.outputs.version }}-canada" \
            --tag "$image:${{ steps.release.outputs.minor }}-canada" \
            --tag "$image:sha-${{ steps.release.outputs.merge_sha }}-canada" \
            --tag "$image:latest-canada" \
            "$canada_source"
          for tag in "${{ steps.release.outputs.version }}" "${{ steps.release.outputs.minor }}" "sha-${{ steps.release.outputs.merge_sha }}" latest; do
            promoted="$(docker buildx imagetools inspect "$image:$tag" | awk '$1 == "Digest:" {print $2; exit}')"
            test "$promoted" = "${{ steps.candidate.outputs.world_digest }}"
          done
          for tag in "${{ steps.release.outputs.version }}-canada" "${{ steps.release.outputs.minor }}-canada" "sha-${{ steps.release.outputs.merge_sha }}-canada" latest-canada; do
            promoted="$(docker buildx imagetools inspect "$image:$tag" | awk '$1 == "Digest:" {print $2; exit}')"
            test "$promoted" = "${{ steps.candidate.outputs.canada_digest }}"
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/release/assets/* \
            --verify-tag \
            --title "MC-CartoLive ${{ steps.release.outputs.version }}" \
            --notes-file "docs/${{ steps.release.outputs.version }}/release_notes.md"
